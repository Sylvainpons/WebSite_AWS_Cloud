services:
  db:
    image: postgres:16-alpine
    container_name: onepiece_db
    environment:
      POSTGRES_DB: onepiece_encyclopedia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - onepiece_network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: onepiece_api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/onepiece_encyclopedia
      NODE_ENV: development
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/uploads:/app/uploads
    networks:
      - onepiece_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: onepiece_frontend
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    networks:
      - onepiece_network

  admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile.dev
    container_name: onepiece_admin
    depends_on:
      - api
    ports:
      - "5174:5174"
    volumes:
      - ./frontend-admin/src:/app/src
    networks:
      - onepiece_network

volumes:
  postgres_data:

networks:
  onepiece_network:
    driver: bridge